<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loreto Labs Med</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #0F172A;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            box-sizing: border-box;
        }
        .contenedor {
            text-align: center;
            max-width: 600px;
        }
        h1 { font-size: 45px; margin-bottom: 10px; }
        h2 { color: #38BDF8; font-weight: normal; margin-bottom: 25px; }
        .grid-modulos {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 25px;
        }
        .btn-modulo {
            display: block;
            padding: 15px;
            background: #1E293B;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            border: 1px solid #334155;
            font-weight: bold;
            transition: all 0.2s ease;
        }
        .btn-modulo:hover {
            background: #0284C7;
            border-color: #38BDF8;
            transform: translateY(-2px);
        }
        .btn-login {
            display: inline-block;
            margin-bottom: 15px;
            padding: 10px 20px;
            background: #0284C7;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="contenedor">
    <h1>🩺 Loreto Labs Med</h1>
    <h2>Sistema Integral de Gestión Clínica</h2>

    <a href="/login/" class="btn-login">🔐 Iniciar Sesión</a>

    <div class="grid-modulos">
        <a href="/medicos/" class="btn-modulo">👨‍⚕️ Panel Médicos</a>
        <a href="/radiologia/" class="btn-modulo">🩻 Panel Radiólogos</a>
        <a href="/recepcion/" class="btn-modulo">👩‍💼 Panel Recepción</a>
        <a href="/configuracion/" class="btn-modulo">⚙️ Configuración</a>
    </div>

    <p style="margin-top:30px; color:#CBD5E1; font-size: 14px;">Versión 0.0.1 | Proyecto desarrollado por Loreto Labs.</p>
</div>

</body>
</html>
